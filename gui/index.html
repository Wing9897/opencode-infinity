<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode Infinity - Web GUI</title>
<link rel="stylesheet" href="/gui/pico.min.css">
<link rel="stylesheet" href="/gui/styles.css">
</head>
<body>
<main class="app-shell">
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">∞</div>
            <div class="brand-text">
                <h1>OpenCode Infinity</h1>
                <p data-i18n="brandSubtitle">AI 編碼工具 7×24 無人值守自動化</p>
            </div>
        </div>
        <div class="status-group">
            <select id="ui-lang-select" class="ui-lang-select" aria-label="UI language">
                <option value="zh-TW">中文</option>
                <option value="en">English</option>
            </select>
            <span id="status-config" class="status-pill status-config" hidden></span>
            <span id="status-run" class="status-pill status-idle" data-i18n="statusIdle">閒置</span>
            <span id="status-conn" class="status-pill status-disconnected" data-i18n="statusDisconnected">未連線</span>
        </div>
    </header>

    <aside class="config-hint" data-i18n="configHint">設定檔請手動編輯 YAML（見啟動日誌中的 config 目錄）。</aside>

    <section id="tab-console" class="workspace">
        <div class="control-card">
            <div class="control-top">
                <div class="field-group field-group-grow">
                    <label class="field-label" for="config-select" data-i18n="labelConfigFile">設定檔</label>
                    <select id="config-select"><option value="" data-i18n="loading">載入中...</option></select>
                </div>
                <div class="action-group" role="group" aria-label="Actions">
                    <button class="js-create-templates-btn btn-secondary" type="button" data-i18n="btnCreateTemplates">建立範本</button>
                    <button id="refresh-configs-btn" class="btn-secondary btn-icon" type="button" data-i18n-title="refreshConfigs" title="重新載入設定檔列表" aria-label="Refresh">↻</button>
                    <button id="start-btn" class="btn-primary" type="button" data-i18n="btnStart">▶ 啟動</button>
                    <button id="stop-btn" class="btn-danger" type="button" data-i18n="btnStop" disabled>⏹ 停止</button>
                </div>
            </div>

            <div class="metrics-row" aria-label="Statistics">
                <div class="stat-card" id="stat-card-rounds">
                    <span class="stat-label" data-i18n="statRounds">輪次</span>
                    <span class="stat-value" id="stat-rounds">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label" data-i18n="statSessions">Session</span>
                    <span class="stat-value" id="stat-sessions">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label" data-i18n="statElapsed">耗時</span>
                    <span class="stat-value" id="stat-elapsed">0:00</span>
                </div>
            </div>

            <details class="console-advanced">
                <summary data-i18n="advancedOptions">進階選項</summary>
                <div class="advanced-grid">
                    <div class="field-group">
                        <label class="field-label" for="working-dir" data-i18n="labelWorkingDir">工作目錄</label>
                        <input type="text" id="working-dir" data-i18n-placeholder="workingDirPlaceholder" placeholder="工作目錄（留空沿用啟動目錄或 YAML 設定）">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="session-id" data-i18n="labelSession">Session ID</label>
                        <div class="input-with-btn">
                            <input type="text" id="session-id" data-i18n-placeholder="sessionPlaceholder" placeholder="Session ID（留空自動生成）">
                            <button id="copy-session-btn" class="btn-secondary btn-icon" type="button" data-i18n-title="copySession" title="複製 Session ID" aria-label="Copy session" disabled>⎘</button>
                        </div>
                    </div>
                </div>
            </details>
        </div>

        <div class="log-card">
            <div class="log-panel-header">
                <span class="log-panel-title" data-i18n="logTitle">即時日誌</span>
                <div class="log-panel-actions">
                    <button id="log-autoscroll-btn" class="ghost-btn active" type="button" data-i18n-title="logAutoscroll" data-i18n="logAutoscroll" title="自動捲動">自動捲動</button>
                    <button id="log-clear-btn" class="ghost-btn" type="button" data-i18n-title="logClear" data-i18n="logClear" title="清除日誌">清除</button>
                </div>
            </div>
            <div id="log-panel" class="log-panel">
                <div id="log-empty" class="log-empty" data-i18n="logEmpty">選擇設定檔後點擊「啟動」，日誌會即時顯示在這裡。</div>
            </div>
        </div>
    </section>
</main>
<div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
<script src="/gui/i18n.js"></script>
<script src="/gui/app.js"></script>
</body>
</html>
