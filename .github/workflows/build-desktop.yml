name: Build and Release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release (e.g. v1.0.0). Only used for manual runs."
        required: false
        default: "v1.0.0"
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-desktop.txt

      - name: Run smoke tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

  build_and_release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-desktop.txt

      - name: Build desktop executable
        run: pyinstaller desktop/opencode_infinity.spec --noconfirm --clean

      - name: Verify build output
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem dist/*.exe
          if (-not $artifacts) { throw 'No executable found in dist/' }
          $artifacts | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Infinity-GUI
          path: dist/*.exe
          if-no-files-found: error

      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'push'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || steps.tag_version.outputs.new_tag }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
          files: dist/*.exe
          fail_on_unmatched_files: true
