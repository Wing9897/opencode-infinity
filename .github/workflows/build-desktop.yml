name: Build and Release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "README.en.md"
      - "docs/**"
      - "scripts/run_tui_smoke_round.py"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release (e.g. v1.1.0). Only used for manual runs."
        required: false
        default: "v1.1.0"
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-desktop.txt

      - name: Run smoke tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Verify TUI entry imports
        env:
          PYTHONUTF8: "1"
        run: |
          python -c "import opencode_infinity; from tui.app import InfinityApp; print('tui ok')"
          python -c "import opencode_infinity; opencode_infinity._configure_stdio_encoding(); print('core ok')"

      - name: Detect existing version tags
        id: version_state
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git tag -l 'v*' | grep -q .; then
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'push'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          custom_tag: ${{ steps.version_state.outputs.has_tags == 'false' && '1.0.0' || '' }}

      - name: Write build metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            VERSION="${{ inputs.release_tag }}"
          elif [ -n "${{ steps.tag_version.outputs.new_tag }}" ]; then
            VERSION="${{ steps.tag_version.outputs.new_tag }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          cat > desktop/build-meta.json <<EOF
          {"version":"${VERSION}","sha":"${GITHUB_SHA}"}
          EOF

      - name: Build desktop executable
        run: pyinstaller desktop/opencode_infinity.spec --noconfirm --clean

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/OpenCode-Infinity.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'Expected dist/OpenCode-Infinity.exe' }
          $exe | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Infinity
          path: dist/OpenCode-Infinity.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || steps.tag_version.outputs.new_tag }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
          body: |
            ## OpenCode Infinity TUI

            - Unified **Textual TUI** interface (console + config editor)
            - Removed browser GUI (`--gui`), Flask, and pywebview desktop shell
            - Windows exe: `OpenCode-Infinity.exe` (console TUI)

            **Usage:** double-click the exe or run `python opencode_infinity.py` from source.
          make_latest: true
          files: dist/OpenCode-Infinity.exe
          fail_on_unmatched_files: true
