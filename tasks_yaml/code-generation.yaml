# 代碼生成配置

code-generation-opencode:
  task:
    name: "代碼生成"
    language: "繁體中文"
    output_dir: "generated"
  cli:
    tool: "opencode"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成工具函數庫：字符串處理、日期格式化、數據驗證"
  summary_prompt: "總結本輪工作（300字內）"

code-generation-claude:
  task:
    name: "代碼生成"
    language: "繁體中文"
    output_dir: "generated"
  cli:
    tool: "claude"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成工具函數庫：字符串處理、日期格式化、數據驗證"
  summary_prompt: "總結本輪工作（300字內）"

code-generation-codex:
  task:
    name: "代碼生成"
    language: "繁體中文"
    output_dir: "generated"
  cli:
    tool: "codex"
    commands:
      run_session: "codex exec resume --last --skip-git-repo-check"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成工具函數庫：字符串處理、日期格式化、數據驗證"
  summary_prompt: "總結本輪工作（300字內）"
