# ==========================================
# 代碼生成任務配置
# Code Generation Task Configuration
# ==========================================

task:
  name: "代碼生成"
  description: "自動生成 Python 工具函數庫"
  language: "繁體中文"
  output_dir: "generated_code"

opencode:
  model: "openai/gpt-5.2-codex"
  max_tokens: 128000
  token_threshold: 0.7

execution:
  delay: 1
  auto_continue_on_error: true
  max_retries: 3

prompts:
  - |
    繼續生成 Python 工具函數，補充以下類別：
    - 字符串處理
    - 文件操作
    - 數據驗證
    
    要求：
    - 使用繁體中文註解
    - 包含單元測試
    - 遵循 PEP 8 規範
    - 添加類型提示
    - 無需詢問直接執行
  
  - |
    請擴充 Python 工具函數庫，添加新的實用函數。
    
    要求：
    - 繁體中文文檔字符串
    - 類型提示完整
    - 錯誤處理完善
    - 包含使用示例
    - 直接執行
  
  - |
    持續新增 Python 工具函數，優先補充較少涵蓋的功能模塊。
    
    要求：
    - 代碼質量高
    - 測試覆蓋完整
    - 性能優化
    - 立即執行

summary_prompt: |
  請用繁體中文總結本輪工作（300字內）：

  【目標】
  擴充 Python 工具函數庫

  【請說明】
  1. 新增了哪些功能模塊
  2. 函數數量和測試覆蓋率
  3. 主要解決的問題類型
  4. 代碼質量指標
  5. 下一步建議

  然後我們換新 session 繼續開發。

context:
  export_last_messages: 5
  max_context_chars: 500
  use_last_snippets: 3

display:
  show_session_id: true
  show_token_usage: true
  show_timestamp: true
  color_per_session: true
