# 文檔配置

documentation-opencode:
  task:
    name: "文檔"
    language: "繁體中文"
    output_dir: "docs"
  cli:
    tool: "opencode"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成項目文檔：README、API 文檔、使用指南"
  summary_prompt: "總結本輪工作（300字內）"

documentation-claude:
  task:
    name: "文檔"
    language: "繁體中文"
    output_dir: "docs"
  cli:
    tool: "claude"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成項目文檔：README、API 文檔、使用指南"
  summary_prompt: "總結本輪工作（300字內）"

documentation-codex:
  task:
    name: "文檔"
    language: "繁體中文"
    output_dir: "docs"
  cli:
    tool: "codex"
    commands:
      run_session: "codex exec resume --last --skip-git-repo-check"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成項目文檔：README、API 文檔、使用指南"
  summary_prompt: "總結本輪工作（300字內）"
