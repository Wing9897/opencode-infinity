# 測試配置

testing-opencode:
  task:
    name: "測試"
    language: "繁體中文"
    output_dir: "tests"
  cli:
    tool: "opencode"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成單元測試：覆蓋所有函數，包含邊界情況"
  summary_prompt: "總結本輪工作（300字內）"

testing-claude:
  task:
    name: "測試"
    language: "繁體中文"
    output_dir: "tests"
  cli:
    tool: "claude"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成單元測試：覆蓋所有函數，包含邊界情況"
  summary_prompt: "總結本輪工作（300字內）"

testing-codex:
  task:
    name: "測試"
    language: "繁體中文"
    output_dir: "tests"
  cli:
    tool: "codex"
    commands:
      run_session: "codex exec resume --last --skip-git-repo-check"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成單元測試：覆蓋所有函數，包含邊界情況"
  summary_prompt: "總結本輪工作（300字內）"
