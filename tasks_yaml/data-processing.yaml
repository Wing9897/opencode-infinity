# 數據處理配置

data-processing-opencode:
  task:
    name: "數據處理"
    language: "繁體中文"
    output_dir: "data"
  cli:
    tool: "opencode"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成數據處理管道：CSV/JSON 讀取、清洗、轉換、導出"
  summary_prompt: "總結本輪工作（300字內）"

data-processing-claude:
  task:
    name: "數據處理"
    language: "繁體中文"
    output_dir: "data"
  cli:
    tool: "claude"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成數據處理管道：CSV/JSON 讀取、清洗、轉換、導出"
  summary_prompt: "總結本輪工作（300字內）"

data-processing-codex:
  task:
    name: "數據處理"
    language: "繁體中文"
    output_dir: "data"
  cli:
    tool: "codex"
    commands:
      run_session: "codex exec resume --last --skip-git-repo-check"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成數據處理管道：CSV/JSON 讀取、清洗、轉換、導出"
  summary_prompt: "總結本輪工作（300字內）"
