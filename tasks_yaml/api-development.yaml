# API 開發配置
# 使用: python3 opencode-infinity.py <session_id> api-development-<tool>

api-development-opencode:
  task:
    name: "API 開發"
    language: "繁體中文"
    output_dir: "api"
  cli:
    tool: "opencode"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - |
      生成 RESTful API 服務：
      - GET/POST/PUT/DELETE /users
      - Express.js + 驗證 + 錯誤處理
      - Swagger 文檔 + 單元測試
  summary_prompt: "總結本輪工作（300字內）"

