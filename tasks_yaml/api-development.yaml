# ==========================================
# API 開發任務配置
# API Development Task Configuration
# ==========================================

task:
  name: "API 開發"
  description: "自動生成 RESTful API 端點和文檔"
  language: "繁體中文"
  output_dir: "api"

opencode:
  model: "openai/gpt-5.2-codex"
  max_tokens: 128000
  token_threshold: 0.75  # 較高閾值，適合代碼開發

execution:
  delay: 2
  timeout: 300
  auto_continue_on_error: true
  max_retries: 5

prompts:
  - |
    繼續開發 RESTful API 端點，補充以下功能模塊：
    - 用戶管理 (CRUD)
    - 身份驗證 (JWT)
    - 數據驗證
    
    要求：
    - 使用 FastAPI/Flask
    - 包含完整的錯誤處理
    - 添加 OpenAPI 文檔
    - 使用繁體中文註解
    - 包含單元測試
    - 直接執行無需確認
  
  - |
    擴充 API 功能，添加新的業務邏輯端點。
    
    要求：
    - RESTful 設計規範
    - 請求/響應驗證
    - 數據庫操作（ORM）
    - 日誌記錄
    - 性能優化
    - 立即執行
  
  - |
    持續完善 API 功能，補充缺失的端點和中間件。
    
    要求：
    - 安全性措施（CORS, Rate Limiting）
    - 異步處理
    - 緩存策略
    - API 版本管理
    - 直接執行

summary_prompt: |
  請用繁體中文總結本輪工作（300字內）：

  【目標】
  開發完整的 RESTful API 服務

  【請說明】
  1. 新增的 API 端點（路由）
  2. 實現的功能模塊
  3. 測試覆蓋情況
  4. 安全性措施
  5. 下一步開發建議

  然後我們換新 session 繼續開發。

context:
  export_last_messages: 5
  max_context_chars: 600
  use_last_snippets: 3

display:
  show_session_id: true
  show_token_usage: true
  show_timestamp: true
  color_per_session: true
