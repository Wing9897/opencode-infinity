# 前端組件配置

frontend-components-opencode:
  task:
    name: "前端組件"
    language: "繁體中文"
    output_dir: "components"
  cli:
    tool: "opencode"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成 React 組件：Button、Input、Modal、Table"
  summary_prompt: "總結本輪工作（300字內）"

frontend-components-claude:
  task:
    name: "前端組件"
    language: "繁體中文"
    output_dir: "components"
  cli:
    tool: "claude"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成 React 組件：Button、Input、Modal、Table"
  summary_prompt: "總結本輪工作（300字內）"

frontend-components-codex:
  task:
    name: "前端組件"
    language: "繁體中文"
    output_dir: "components"
  cli:
    tool: "codex"
    commands:
      run_session: "codex exec resume --last --skip-git-repo-check"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成 React 組件：Button、Input、Modal、Table"
  summary_prompt: "總結本輪工作（300字內）"
