# ==========================================
# 醫療知識庫自動生成配置
# Medical Knowledge Base Auto-Generation
# ==========================================

# 任務配置
task:
  name: "醫療知識庫"
  description: "自動生成家居常見症狀處理指引文檔"
  language: "繁體中文"
  output_dir: "症狀"  # 輸出目錄

# OpenCode 設置
opencode:
  model: "openai/gpt-5.2-codex"
  max_tokens: 128000
  token_threshold: 0.7  # 達到 70% 時切換 session

# 執行設置
execution:
  delay: 1                      # 每輪延遲（秒）
  timeout: 300                  # 基礎超時（秒），會指數退避：5分鐘→10分鐘→20分鐘→40分鐘→60分鐘
  auto_continue_on_error: true  # 執行失敗是否繼續
  max_retries: 5                # 最大重試次數（指數退避）

# 提示詞（按順序輪轉）
prompts:
  - |
    繼續建立家居常見症狀處理指引，新增 3-5 個不同的症狀類型。
    所有文件必須保存在「症狀/」目錄。
    要求：
    - 使用繁體中文
    - 保持格式一致
    - 症狀編號連續
    - 無需詢問直接執行
    - 完成後只輸出一次總結，不要重複
  
  - |
    請繼續擴充家居常見症狀知識庫，加入更多日常症狀。
    所有文件必須保存在「症狀/」目錄。
    要求：
    - 使用繁體中文
    - 選擇未涵蓋的症狀
    - 編號連續遞增
    - 直接新增無需確認
    - 完成後只輸出一次總結，不要重複
  
  - |
    持續新增家居症狀處理文檔，涵蓋其他常見不適。
    所有文件必須保存在「症狀/」目錄。
    要求：
    - 使用繁體中文
    - 優先補充較少分類
    - 格式完全一致
    - 立即執行
    - 完成後只輸出一次總結，不要重複

# 總結提示詞（達到 token 閾值時使用）
summary_prompt: |
  請用繁體中文總結本輪工作（300字內），只輸出一次，不要重複：

  【目標】
  擴展家居症狀知識庫，建立涵蓋各種常見症狀的處理指引文檔

  【請說明】
  1. 新增了哪些症狀類型/分類
     （例如：耳鼻喉、腸胃、皮膚、神經等）
  
  2. 症狀編號範圍
     （例如：S0212-S0233）
  
  3. 主要涵蓋的緊急層級
     （家居處理/建議門診/盡快就醫等）
  
  4. 是否有更新索引檔案
  
  5. 下一步建議

  然後我們換新 session 繼續擴充。

# 上下文傳遞設置
context:
  export_last_messages: 5   # 導出最後 N 條消息
  max_context_chars: 500    # 單條消息最大字符數
  use_last_snippets: 3      # 使用最後 N 個片段

# 顯示設置
display:
  show_session_id: true      # 顯示 session ID
  show_token_usage: true     # 顯示 token 使用量
  show_timestamp: true       # 顯示時間戳
  color_per_session: true    # 每個 session 不同顏色
