# 醫療知識庫配置

medical-kb-opencode:
  task:
    name: "醫療知識庫"
    language: "繁體中文"
    output_dir: "medical"
  cli:
    tool: "opencode"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成醫療知識庫系統：疾病查詢、症狀匹配、藥物信息"
  summary_prompt: "總結本輪工作（300字內）"

medical-kb-claude:
  task:
    name: "醫療知識庫"
    language: "繁體中文"
    output_dir: "medical"
  cli:
    tool: "claude"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成醫療知識庫系統：疾病查詢、症狀匹配、藥物信息"
  summary_prompt: "總結本輪工作（300字內）"

medical-kb-codex:
  task:
    name: "醫療知識庫"
    language: "繁體中文"
    output_dir: "medical"
  cli:
    tool: "codex"
    commands:
      run_session: "codex exec resume --last --skip-git-repo-check"
  opencode:
    max_tokens: 128000
    token_threshold: 0.7
  execution:
    delay: 1
    timeout: 300
    max_retries: 5
  prompts:
    - "生成醫療知識庫系統：疾病查詢、症狀匹配、藥物信息"
  summary_prompt: "總結本輪工作（300字內）"
