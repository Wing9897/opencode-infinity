# ==========================================
# Codex 通用配置
# ==========================================
# 使用: python opencode-infinity.py codex
#
# 重要：請在目標專案目錄中執行，不要在本工具目錄執行
# 注意：Codex 不支持 Token 統計，使用輪次策略

# 任務配置
task:
  name: "通用任務"
  description: "Codex 自動執行 - 持續運行"
  language: "繁體中文"
  output_dir: "output"

# CLI 工具配置
cli:
  tool: "codex"
  model: "openai/gpt-5.2-codex"
  commands:
    run_session: "codex exec resume --skip-git-repo-check"

# 執行設置
execution:
  delay: 1                        # 每輪延遲（秒）
  timeout: 300                    # 基礎超時（秒）
  max_retries: 5                  # 最大重試次數
  auto_continue_on_error: true    # 錯誤時自動繼續
  max_rounds: 0                   # 最大輪次（0 = 無限制）
  switch_after_rounds: 0          # 幾輪後切換 session（0 = 不切換）
  max_tokens: 128000              # 最大 token 限制（Codex 不支援 token 統計，改用輪次策略）
  token_threshold: 0.7            # Token 閾值（Codex 會忽略此值）

# 顯示設置
display:
  show_session_id: true
  show_token_usage: false
  show_timestamp: true

# 提示詞（輪轉使用）
# ⚠️ 請根據你的目標專案修改以下提示詞
prompts:
  - "繼續工作"
  - "繼續完成未完成的任務"
  - "檢查並修復問題"

# 總結提示詞
summary_prompt: |
  請用繁體中文總結本輪工作（300字內）：
  1. 完成了哪些功能
  2. 主要改進點
  3. 下一步建議
