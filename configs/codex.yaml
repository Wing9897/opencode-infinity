task:
  name: ETF與基金全面分析報告
  language: 繁體中文
  output_dir: output
  description: 系統性搜索並整理全球可用的ETF與基金產品，涵蓋高至低風險等級，深入分析每個產品的費用結構（TER/MER）、股息率、歷史回報（1年/3年/5年/10年）及風險指標（標準差、Sharpe比率、最大回撤）。最終依「核心全球股票
    + 高股息 + REIT」三大框架，將所有分析整合至同一份 .md 文件，並以多維度評價表格呈現，輸出結構化、可直接使用的投資參考報告。
cli:
  tool: opencode
execution:
  delay: 1
  timeout: 300
  max_retries: 5
  max_rounds: 0
  switch_after_rounds: 0
  max_tokens: 128000
  token_threshold: 0.7
  auto_continue_on_error: true
display:
  show_session_id: true
  show_token_usage: true
  show_timestamp: true
prompts:
- 根據「核心全球股票 + 高股息 + REIT」三大框架，開始搜索並列出每個框架下最具代表性的主流ETF與基金產品（每類至少10個），包含其發行商、追蹤指數、市場、貨幣及基本規模資料。將結果以結構化清單整理，並開始在
  report.md 中建立文件骨架與各框架章節標題。
- 全面審查 report.md 的數據完整性：核對所有費用率、股息率、回報數據是否有來源標注及日期；驗證表格格式是否統一（欄位對齊、單位一致、N/A 填補）；檢查各ETF的風險分類是否準確；確保三大框架的評分與推薦邏輯一致，並在文件末尾加入「數據來源與免責聲明」章節，完成最終版本輸出。
- 整理並優化 report.md 的整體結構與視覺呈現：確認所有多維度評價表格均已包含「風險等級、費用評分、股息評分、回報評分、香港可及性、綜合推薦評級」六大維度；為每個框架撰寫100字以內的選擇理由摘要；最後生成一張「三框架最終精選名單」匯總表，列出每個框架的Top
  3推薦產品及其核心優勢。
summary_prompt: 請在300字以內總結本輪工作的完成情況，包含：①已成功搜索並整理了哪些ETF/基金（列出產品數量及框架分類）；②哪些數據欄位已填寫完整，哪些仍待補充；③report.md
  目前的文件結構狀態（已完成的章節 vs 待完善的章節）；④本輪遇到的任何數據缺口或問題；⑤下一輪應優先處理的任務。請以條列方式呈現，方便下一個 session
  快速接手繼續工作。
